<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Evidência visual dos três modos de roteamento adaptativo</title>
  <desc id="desc">Simple usa uma curva livre, Orthogonal contorna um obstáculo e Loop External retorna pela borda externa.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#16a34a"/></marker></defs>
  <rect width="1200" height="430" rx="24" fill="#f8fafc"/>
  <g font-family="Inter,Arial,sans-serif"><text x="40" y="45" font-size="24" font-weight="700" fill="#0f172a">Edge router híbrido — evidência dos modos</text>
    <g transform="translate(35 75)"><rect width="350" height="310" rx="18" fill="white" stroke="#dbe4df"/><text x="20" y="34" font-size="17" font-weight="700">SIMPLE</text><text x="20" y="57" font-size="12" fill="#64748b">Corredor livre · curva original</text><rect x="25" y="110" width="105" height="68" rx="10" fill="#ecfdf5" stroke="#10b981"/><rect x="220" y="110" width="105" height="68" rx="10" fill="#ecfdf5" stroke="#10b981"/><text x="60" y="150">A</text><text x="255" y="150">B</text><path d="M130 144 C160 95 195 195 220 144" fill="none" stroke="#16a34a" stroke-width="3" marker-end="url(#arrow)"/></g>
    <g transform="translate(425 75)"><rect width="350" height="310" rx="18" fill="white" stroke="#dbe4df"/><text x="20" y="34" font-size="17" font-weight="700">ORTHOGONAL</text><text x="20" y="57" font-size="12" fill="#64748b">Node intercepta o corredor</text><rect x="20" y="110" width="90" height="68" rx="10" fill="#ecfdf5" stroke="#10b981"/><rect x="240" y="110" width="90" height="68" rx="10" fill="#ecfdf5" stroke="#10b981"/><rect x="130" y="100" width="90" height="88" rx="10" fill="#fff7ed" stroke="#f97316"/><text x="55" y="150">A</text><text x="275" y="150">C</text><text x="165" y="148">B</text><path d="M110 144 L120 144 L120 220 L230 220 L230 144 L240 144" fill="none" stroke="#16a34a" stroke-width="3" marker-end="url(#arrow)"/></g>
    <g transform="translate(815 75)"><rect width="350" height="310" rx="18" fill="white" stroke="#dbe4df"/><text x="20" y="34" font-size="17" font-weight="700">LOOP_EXTERNAL</text><text x="20" y="57" font-size="12" fill="#64748b">Retorno contorna o grupo</text><rect x="35" y="105" width="95" height="68" rx="10" fill="#ecfdf5" stroke="#10b981"/><rect x="220" y="105" width="95" height="68" rx="10" fill="#ecfdf5" stroke="#10b981"/><text x="70" y="145">A</text><text x="255" y="145">C</text><path d="M220 140 L205 140 L205 205 L15 205 L15 80 L82 80 L82 105" fill="none" stroke="#16a34a" stroke-width="3" marker-end="url(#arrow)"/></g>
  </g>
</svg>
